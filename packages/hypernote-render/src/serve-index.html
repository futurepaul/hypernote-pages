<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypernote Preview</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #1f2937;
      }
      a { color: #2563eb; text-decoration: underline; }
      a:hover { color: #1d4ed8; }
      img { max-width: 100%; }
      code {
        background: #f3f4f6;
        padding: 0.1em 0.3em;
        border-radius: 0.25rem;
        font-size: 0.9em;
      }
      pre {
        background: #1f2937;
        color: #f9fafb;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin-bottom: 1rem;
      }
      pre code {
        background: none;
        padding: 0;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./serve-frontend.tsx"></script>
  </body>
</html>
